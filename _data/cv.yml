  website: https://researchmap.jp/yoshidaren
  summary: >-
    行為の哲学を中心に、自己知とその限界（自己欺瞞）に関するトピックを研究しています。
    あわせて 20 世紀オックスフォード・ケンブリッジの哲学（ウィトゲンシュタイン、ムーア、ライル、アンスコム、オースティン、ストローソン、ウィリアムズ、ギーチ、ダメット）を哲学史的な関心から研究し、
    とくに G. E. M. アンスコムについては著作の翻訳と、その思想を明晰な形で取り出すことを目標にしています。
