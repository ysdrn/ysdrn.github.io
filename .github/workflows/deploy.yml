name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22" # purgecss 9 は Node 22.12 以上
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Check Amazon card cache
        run: ruby bin/amazon_cache.rb --check --warn
      - name: Check diary cards
        run: python3 bin/diary_cards.py --check # 写真・カードがない週、古いカードを警告するだけ（ページは小さいカードに戻る）
      - name: Install and Build
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS
        run: npx purgecss -c purgecss.config.js # purgecss は devDependencies（npm ci で入る）
      - name: Re-hash CSS URLs after purge
        run: ruby bin/bust_purged_css.rb _site # ?v= を削ったあとの CSS の中身から付け直す（記事しだいで中身が変わるため）
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
